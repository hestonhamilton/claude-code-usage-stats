# Deterministic quality gate. This is the ONE validation command for this repo:
#   pre-commit run --all-files
# `pre-commit install` installs both hook types below. pre-commit owns the git hooks here:
# never set core.hooksPath (pre-commit refuses to install while it is set).
# Hook versions are pinned and bumped deliberately. `pre-commit autoupdate` can
# DOWNGRADE gitleaks (its latest release is a lightweight tag); cross-check with
# `gh api repos/<owner>/<repo>/releases/latest`. See ~/docs/dev-notes.md 2026-10-23.
# Rendered from the dotfiles repo-baseline template; `copier update` refreshes it.
default_install_hook_types: [pre-commit, commit-msg]
exclude: ^\.beads/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1  # latest release is a lightweight tag; `autoupdate` picks v8.30.0, so keep this pinned by hand
    hooks:
      - id: gitleaks  # staged changes only (upstream entry uses --staged)
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (full git history)
        entry: gitleaks git --redact --verbose
        stages: [manual]  # CI: pre-commit run --hook-stage manual gitleaks-history

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Rule set is pinned in ruff.toml (ruff with no config enables ~790 rules).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format

  # Rejects AI attribution in the final commit message, whatever wrote it. pygrep fails on any
  # matching line; the lookahead skips git's comment lines. Same markers as the Claude scaffold's
  # commit-msg hook, moved into pre-commit's commit-msg stage.
  - repo: local
    hooks:
      - id: no-ai-attribution
        name: no AI attribution in the commit message
        language: pygrep
        entry: '(?i)^(?![ \t]*#).*(co[-_ ]?authored[-_ ]?by[ \t]*[:=]|generated[ \t]+(with|by)[^a-z0-9]*(claude|anthropic)|made[ \t]+with[^a-z0-9]*claude|noreply@anthropic\.com|claude\.ai/code)'
        stages: [commit-msg]
