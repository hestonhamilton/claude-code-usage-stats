{% if rows %}
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>{{ label }}</th>
          <th class="num">Events</th>
          <th class="num">Sessions</th>
          <th class="num">Tokens</th>
          <th class="num">API-equiv. cost</th>
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
          <tr>
            <td class="clip">{{ row[key] }}</td>
            <td class="num">{{ row.events|intfmt }}</td>
            <td class="num">{{ row.sessions|intfmt }}</td>
            <td class="num">{{ row.tokens|intfmt }}</td>
            <td class="num">{{ row.cost_usd|cost }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% else %}
  <p class="muted">No data.</p>
{% endif %}
